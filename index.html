<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Radetzky FM</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Ikonok -->
  <link rel="icon" type="image/png" sizes="128x128" href="icon-128x128.png" />
  <link rel="icon" type="image/png" sizes="521x521" href="icon-521x521.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="icon-128x128.png" />
  <link rel="apple-touch-icon" sizes="521x521" href="icon-521x521.png" />

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: linear-gradient(to bottom, #000000, #ffffff);
      color: #999999;
      font-family: sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    header {
      margin-top: 24px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      user-select: none;
      flex-shrink: 0; /* ne zsugorodjon le */
    }

    main {
      flex-grow: 1;
    }

    footer {
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 16px;
      box-sizing: border-box;
      flex-shrink: 0; /* ne zsugorodjon */
    }


    .metadata-box {
  background: #f5f5f5;
  border: 1px solid #ddd;
  padding: 16px;
  text-align: center;
  border-radius: 4px;
  color: #000;
  width: 100%;
  box-sizing: border-box;
  cursor: pointer; /* ezt adjuk hozzá */
  user-select: none; /* hogy véletlen se jelöljön ki szöveget kattintáskor */
}

    .player-container {
      background: #f5f5f5;
      border: 1px solid #ddd;
      padding: 25px;
      text-align: center;
      border-radius: 4px;
      color: #000;
      width: 100%;
      box-sizing: border-box;
    }

    audio {
      width: 100%;
      border-radius: 4px;
    }

    .title-wrap {
  position: relative;
  display: inline-block;
}

.title-wrap .bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 0;
}

.title-wrap .text {
  position: relative;
  z-index: 1;
  font-size: 32px;
  font-weight: bold;
  color: white;
  padding: 12px 20px;
}

  </style>
</head>
<body>
  <header>Radetzky FM</header>
  <div class="title-wrap">
  <img src="logotrsparent.png" class="bg">
  
</div>

  <main></main> <!-- ez kitölti a helyet a header és footer között -->

  <footer>
    <div class="metadata-box" id="metadataBox" onclick="window.fetchStreamTitle()">
  <div id="dynamic-title">Betöltés...</div>
</div>



    <div class="player-container">
      <audio controls>
        <source src="https://katolikusradio.hu:8001/radetzkyfm" type="audio/mpeg" />
        A böngésződ nem támogatja az audio lejátszást.
      </audio>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const BIN_ID = "696bca7fae596e708fe315dd";
const READ_KEY = "$2a$10$dshD4vVV4afJO3EHmk9WqOoVKatrdqTxFm.IbMsNhAe5K8p/RkRMC";
const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

async function updateMeta() {
    try {
        const res = await fetch(URL, {
            headers: {
                "X-Master-Key": READ_KEY
            }
        });

        if (!res.ok) throw new Error("Hiba a JSON lekérésénél");

        const data = await res.json();

        // csak a tartalom, “Most szól:” nélkül
        document.getElementById("dynamic-title").textContent = `${data.record.playing}`;
    } catch (e) {
        document.getElementById("dynamic-title").textContent = "Hiba: " + e.message;
    }
}

// frissítés 5 másodpercenként
updateMeta();
setInterval(updateMeta, 5000);
  </script>
</body>
</html>
